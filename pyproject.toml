[project]
name = "spatial-reasoning-mcp"
version = "0.1.0"
description = "MCP server exposing geospatial computation, routing and place resolution as agent tools"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "httpx>=0.27", "shapely>=2.0", "pydantic>=2", "tzdata"]

[project.optional-dependencies]
routing = ["osmnx>=2.0", "networkx>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spatial_reasoning_mcp"]
